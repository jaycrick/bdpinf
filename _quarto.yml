project:
  type: website
  output-dir: _output
  render:
    - qmd_scripts/validation/**/*.qmd
    - docs/*.qmd

bibliography: bibliography.bib
cite-method: citeproc
link-citations: true

website:
  title: "bdpinf: Birth-Death Process Inference"
  repo-url: https://github.com/jaycrick/bdpinf
  repo-actions: [edit, issue]
  bread-crumbs: true
  page-navigation: true
  navbar:
    left:
      - text: "Validation: Single-Epoch"
        menu:
          - text: "Simulation checks"
            file: qmd_scripts/validation/single_epoch/01_simulation_checks.qmd
          - text: "Single-fit debug"
            file: qmd_scripts/validation/single_epoch/02_single_fit_debug.qmd
          - text: "Optimisation framework"
            file: qmd_scripts/validation/single_epoch/03_optimisation_framework.qmd
          - text: "Bulk inference"
            file: qmd_scripts/validation/single_epoch/06_bulk_inference.qmd
          - text: "Asymptotic consistency"
            file: qmd_scripts/validation/single_epoch/07_asymptotic_consistency.qmd
          - text: "Asymptotic consistency (LLM)"
            file: qmd_scripts/validation/single_epoch/08_asymptotic_consistency_llm.qmd
          - text: "Asymptotic consistency (fixed T)"
            file: qmd_scripts/validation/single_epoch/09_asymptotic_consistency_fixed_time.qmd
          - text: "Likelihood surface comparison"
            file: qmd_scripts/validation/single_epoch/10_likelihood_surface_comparison.qmd
      - text: "Validation: Multi-Epoch"
        menu:
          - text: "Simulation checks"
            file: qmd_scripts/validation/multi_epoch/01_simulation_checks.qmd
          - text: "Single-fit debug"
            file: qmd_scripts/validation/multi_epoch/02_single_fit_debug.qmd
          - text: "Bulk inference"
            file: qmd_scripts/validation/multi_epoch/03_bulk_inference.qmd
          - text: "Bulk inference (single rate)"
            file: qmd_scripts/validation/multi_epoch/04_bulk_inference_single_rate.qmd
          - text: "Bulk inference (zero birth)"
            file: qmd_scripts/validation/multi_epoch/05_bulk_inference_zero_birth.qmd
          - text: "Sensitivity + benchmark"
            file: qmd_scripts/validation/multi_epoch/06_sensitivity_benchmark.qmd
          - text: "Multilevel-splitting survival"
            file: qmd_scripts/validation/multi_epoch/07_multilevel_splitting_survival.qmd
      - text: "Validation: Bayesian Multi-Epoch"
        menu:
          - text: "Simulation checks"
            file: qmd_scripts/validation/bayesian_multi_epoch/01_simulation_checks.qmd
          - text: "Single-fit debug"
            file: qmd_scripts/validation/bayesian_multi_epoch/02_single_fit_debug.qmd
          - text: "Bulk inference"
            file: qmd_scripts/validation/bayesian_multi_epoch/03_bulk_inference.qmd
          - text: "Diagnostics + benchmark"
            file: qmd_scripts/validation/bayesian_multi_epoch/04_diagnostics_benchmark.qmd
      - text: "Validation: Time-Varying Rates"
        menu:
          - text: "Spine-age shapes"
            file: qmd_scripts/validation/time_varying_rates/01_spine_age_shapes.qmd
          - text: "Non-spine age shapes"
            file: qmd_scripts/validation/time_varying_rates/02_non_spine_age_shapes.qmd
          - text: "Piecewise-linear fitting"
            file: qmd_scripts/validation/time_varying_rates/03_piecewise_linear_recovery.qmd
          - text: "Spine-age shapes: exponential, quadratic, sinusoidal"
            file: qmd_scripts/validation/time_varying_rates/04_spine_age_shapes_nonlinear.qmd
          - text: "Age densities: parametric hazards"
            file: qmd_scripts/validation/time_varying_rates/05_parametric_hazard_shapes.qmd
      - text: "Validation: Survival-Conditioned Simulation"
        menu:
          - text: "Simulator comparison"
            file: qmd_scripts/validation/survival_conditioned_simulation/01_simulator_comparison.qmd
          - text: "Subcritical splitting"
            file: qmd_scripts/validation/survival_conditioned_simulation/02_subcritical_splitting.qmd
      - text: "Docs"
        menu:
          - text: "Likelihoods"
            file: docs/likelihoods.qmd
          - text: "Spline rate families"
            file: docs/spline_rates.qmd

format:
  html:
    respect-user-color-scheme: true
    code-overflow: wrap
    theme: flatly
    toc: true
    toc-depth: 3
    code-fold: true
    code-tools: true
    embed-resources: false
    html-math-method: mathjax
    fig-width: 10
    fig-height: 6
    mainfont: "Libertinus Sans, system-ui, sans-serif"
    monofont: "ui-monospace, 'Cascadia Code', 'Source Code Pro', Menlo, Consolas, 'DejaVu Sans Mono', monospace"

execute:
  warning: true
  message: true
  cache: true
  freeze: auto  # re-render only when source changes
