format:
  html:
    css:
      - reference/_styles-quartodoc.css
    respect-user-color-scheme: true
    code-overflow: wrap
    theme: flatly
    toc: true
    toc-depth: 3
    code-fold: true
    code-tools: true
    embed-resources: false
    html-math-method: mathjax
    fig-width: 10
    fig-height: 6
    mainfont: "Libertinus Sans, system-ui, sans-serif"
    monofont: "ui-monospace, 'Cascadia Code', 'Source Code Pro', Menlo, Consolas, 'DejaVu Sans Mono', monospace"

execute:
  warning: true
  message: true
  cache: true

quartodoc:
  package: inf_bp_texts
  sidebar: reference/_sidebar.yml
  css: reference/_styles-quartodoc.css
  parser: numpy
  sections:
    - title: Core model
      desc: >
        BirthDeathProcess — the central data structure passed between all
        modules. Holds creation times, epoch boundaries, per-epoch birth/death
        rates, and optional manuscript genealogy.
      contents:
        - models.birth_death_process.BirthDeathProcess

    - title: Mathematical functions
      desc: >
        Pure likelihood and probability functions. No class state; all inputs
        and outputs are float64 tensors.
      contents:
        - models.math_extinction
        - models.math_ages
        - models.math_populations
        - models.mathematical_derivatives

    - title: Input validation
      desc: >
        Normalisation and runtime validation for tensors, shapes, ranges, and
        epoch monotonicity.
      contents:
        - models.validation

    - title: Inference
      desc: Maximum likelihood estimation and covariance.
      contents:
        - inference.fitting.fit_birth_death_processes
        - inference.fitting.fit_from_data_frame
        - inference.fitting.ParameterConstraints
        - inference.likelihood.log_likelihood
        - inference.likelihood.negative_log_likelihood
        - inference.uncertainty

    - title: Simulation
      desc: Gillespie simulation and multilevel splitting for rare-event estimation.
      contents:
        - simulation.simulator.simulate_birth_death_process
        - simulation.simulator.simulate_bdp_ages_from_distributions
        - simulation.splitting.simulate_subcritical_survival_splitting
        - simulation.splitting.SplittingConfig
        - simulation.splitting.select_level_times_for_band

    - title: Visualization
      desc: Plotly rendering utilities for model results and diagnostics.
      contents:
        - visualization.plotting.save_figure
        - visualization.splitting_plots
        - visualization.parameter_plots

    - title: Analysis
      desc: Higher-level helpers for summarising and comparing fit results.
      contents:
        - analysis.single_epoch

    - title: Data pipeline
      desc: >
        NTVMR manuscript data download, XML processing, cleaning, and pattern
        analysis.
      contents:
        - data.ntvmr
        - data.xml_processing
        - data.data_cleaning
        - data.content_extraction
        - data.pattern_analysis
        - data.reports
