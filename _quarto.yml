project:
  type: website
  output-dir: _output
  render:
    - qmd_scripts/*.qmd
    - docs/*.qmd
    - reference/*.qmd

metadata-files:
  - reference/_sidebar.yml

bibliography: bibliography.bib
cite-method: biblatex
link-citations: true

website:
  title: "Inference on Birth-Death Processes for Texts"
  repo-url: https://github.com/jaycrick/inf-bp-texts
  repo-actions: [edit, issue]
  bread-crumbs: true
  page-navigation: true
  navbar:
    left:
      - text: "Reference"
        file: reference/index.qmd
      - text: "Analysis Scripts"
        menu:
          - text: "Data Exploration"
            file: qmd_scripts/manuscript_data_exploration.qmd
          - text: "Birth-Death Inference"
            file: qmd_scripts/birth_death_inference.qmd
          - text: "Birth-Death Inference (Multiple Initial Manuscripts)"
            file: qmd_scripts/birth_death_inference_mult_start.qmd
          - text: "Methods Validation"
            file: qmd_scripts/methods_validation.qmd
          - text: "Multi-Epoch Validation"
            file: qmd_scripts/methods_validation_multi_epoch.qmd
          - text: "Optimiser Comparison"
            file: qmd_scripts/optimiser_comparison.qmd
      - text: "Docs"
        menu:
          - text: "Likelihoods"
            file: docs/likelihoods.qmd

format:
  html:
    css:
      - reference/_styles-quartodoc.css
    respect-user-color-scheme: true
    code-overflow: wrap
    theme: cosmo
    toc: true
    toc-depth: 3
    code-fold: true
    code-tools: true
    embed-resources: false
    html-math-method: mathjax
    backgroundcolor: "#fff1e5"
    fig-width: 10
    fig-height: 6
    mainfont: "Libertinus Sans, system-ui, sans-serif"
    monofont: "ui-monospace, 'Cascadia Code', 'Source Code Pro', Menlo, Consolas, 'DejaVu Sans Mono', monospace"

execute:
  warning: true
  message: true
  cache: true

quartodoc:
  # the name used to import the package you want to create reference docs for
  package: inf_bp_texts
  sidebar: reference/_sidebar.yml
  css: reference/_styles-quartodoc.css
  parser: numpy
  sections:
    - title: Mathematical functions
      desc: Core mathematical routines for the birth-death process models.
      contents:
        - models
        - models.mathematical_functions
        - models.mathematical_functions.calculate_populations_log_lik
        - models.mathematical_functions.calculate_non_spine_ages_log_lik
        - models.mathematical_functions.calculate_spine_ages_log_lik
        - models.mathematical_functions.calculate_ages_log_lik
        - models.mathematical_functions.calculate_extinction_pr
        - models.mathematical_functions.calculate_log_lik_lifetimes
        - inference
        - inference.fitting
        - inference.fitting.fit_birth_death_processes
        - inference.fitting.fit_from_dataframe
