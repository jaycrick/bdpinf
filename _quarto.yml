project:
  type: website
  output-dir: _output
  render:
    - qmd_scripts/*.qmd
    - qmd_scripts/validation/**/*.qmd
    - qmd_scripts/core_analysis/**/*.qmd
    - "!qmd_scripts/validation/bayesian_multi_epoch/**/*.qmd"
    - "!qmd_scripts/core_analysis/04_bayesian/**/*.qmd"
    - docs/*.qmd
    - reference/*.qmd

metadata-files:
  - reference/_sidebar.yml

bibliography: bibliography.bib
cite-method: biblatex
link-citations: true

website:
  title: "Inference on Birth-Death Processes for Texts"
  repo-url: https://github.com/jaycrick/inf-bp-texts
  repo-actions: [edit, issue]
  bread-crumbs: true
  page-navigation: true
  navbar:
    left:
      - text: "Reference"
        file: reference/index.qmd
      - text: "Data Exploration"
        menu:
          - text: "NTVMR Data Exploration"
            file: qmd_scripts/core_analysis/01_data_exploration/manuscript_data_exploration.qmd
          - text: "Kashouh Data Exploration"
            file: qmd_scripts/core_analysis/01_data_exploration/kashouh_data_exploration.qmd
      - text: "Single-Epoch Analysis"
        menu:
          - text: "NTVMR Single-Epoch"
            file: qmd_scripts/core_analysis/02_single_epoch/ntvmr_single_epoch_inference.qmd
          - text: "Kashouh Single-Epoch (FamilyK + FamilyJB)"
            file: qmd_scripts/core_analysis/02_single_epoch/kashouh_single_epoch_inference.qmd
      - text: "Multi-Epoch Analysis"
        menu:
          - text: "NTVMR Six-Epoch"
            file: qmd_scripts/core_analysis/03_multi_epoch/ntvmr_birth_death_inference.qmd
          - text: "NTVMR Multi-Initial"
            file: qmd_scripts/core_analysis/03_multi_epoch/birth_death_inference_multi_initial_population.qmd
          - text: "Kashouh Classification"
            file: qmd_scripts/core_analysis/03_multi_epoch/kashouh_birth_death_analysis.qmd
          - text: "Likelihood Surface"
            file: qmd_scripts/core_analysis/03_multi_epoch/likelihood_single_vs_multi_epoch_comparison.qmd
          - text: "Optimizer"
            file: qmd_scripts/core_analysis/03_multi_epoch/optimizer_comparison.qmd
      - text: "Bayesian Analysis"
        menu:
          - text: "Kashouh FamilyK Bayesian"
            file: qmd_scripts/core_analysis/04_bayesian/kashouh_family_k_bayesian_inference.qmd
      - text: "Validation: Single-Epoch"
        menu:
          - text: "Asymptotic consistency"
            file: qmd_scripts/validation/single_epoch/methods_validation_asymptotic_consistency.qmd
          - text: "Simulation checks"
            file: qmd_scripts/validation/single_epoch/methods_validation_simulation_checks.qmd
          - text: "Single-fit debug"
            file: qmd_scripts/validation/single_epoch/methods_validation_single_fit_debug.qmd
          - text: "Optimisation framework"
            file: qmd_scripts/validation/single_epoch/methods_validation_optimisation_framework.qmd
          - text: "Bulk inference"
            file: qmd_scripts/validation/single_epoch/methods_validation_bulk_inference.qmd
          # Sensitivity + benchmark entry removed
      - text: "Validation: Multi-Epoch"
        menu:
          - text: "Simulation checks"
            file: qmd_scripts/validation/multi_epoch/methods_validation_multi_epoch_simulation_checks.qmd
          - text: "Single-fit debug"
            file: qmd_scripts/validation/multi_epoch/methods_validation_multi_epoch_single_fit_debug.qmd
          - text: "Bulk inference"
            file: qmd_scripts/validation/multi_epoch/methods_validation_multi_epoch_bulk_inference.qmd
          - text: "Bulk inference (single rate)"
            file: qmd_scripts/validation/multi_epoch/methods_validation_multi_epoch_bulk_inference_single_rate.qmd
          - text: "Bulk inference (zero birth second epoch)"
            file: qmd_scripts/validation/multi_epoch/methods_validation_multi_epoch_bulk_inference_zero_birth_second_epoch.qmd
          - text: "Sensitivity + benchmark"
            file: qmd_scripts/validation/multi_epoch/methods_validation_multi_epoch_sensitivity_benchmark.qmd
      - text: "Validation: Bayesian Multi-Epoch"
        menu:
          - text: "Simulation checks"
            file: qmd_scripts/validation/bayesian_multi_epoch/methods_validation_multi_epoch_bayesian_simulation_checks.qmd
          - text: "Single-fit debug"
            file: qmd_scripts/validation/bayesian_multi_epoch/methods_validation_multi_epoch_bayesian_single_fit_debug.qmd
          - text: "Bulk inference"
            file: qmd_scripts/validation/bayesian_multi_epoch/methods_validation_multi_epoch_bayesian_bulk_inference.qmd
          - text: "Diagnostics + benchmark"
            file: qmd_scripts/validation/bayesian_multi_epoch/methods_validation_multi_epoch_bayesian_diagnostics_benchmark.qmd
      - text: "Docs"
        menu:
          - text: "Likelihoods"
            file: docs/likelihoods.qmd

format:
  html:
    css:
      - reference/_styles-quartodoc.css
    respect-user-color-scheme: true
    code-overflow: wrap
    theme: cosmo
    toc: true
    toc-depth: 3
    code-fold: true
    code-tools: true
    embed-resources: false
    html-math-method: mathjax
    backgroundcolor: "#fff1e5"
    fig-width: 10
    fig-height: 6
    mainfont: "Libertinus Sans, system-ui, sans-serif"
    monofont: "ui-monospace, 'Cascadia Code', 'Source Code Pro', Menlo, Consolas, 'DejaVu Sans Mono', monospace"

execute:
  warning: true
  message: true
  cache: true

quartodoc:
  # the name used to import the package you want to create reference docs for
  package: inf_bp_texts
  sidebar: reference/_sidebar.yml
  css: reference/_styles-quartodoc.css
  parser: numpy
  sections:
    - title: Mathematical functions
      desc: Core mathematical routines for the birth-death process models.
      contents:
        - models
        - models.mathematical_functions
        - models.mathematical_functions.calculate_populations_log_lik
        - models.mathematical_functions.calculate_non_spine_ages_log_lik
        - models.mathematical_functions.calculate_spine_ages_log_lik
        - models.mathematical_functions.calculate_ages_log_lik
        - models.mathematical_functions.calculate_extinction_pr
        - models.mathematical_functions.calculate_log_lik_lifetimes
        - inference
        - inference.fitting
        - inference.fitting.fit_birth_death_processes
        - inference.fitting.fit_from_data_frame
