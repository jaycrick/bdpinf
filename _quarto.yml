project:
  type: website
  output-dir: _output
  render:
    - qmd_scripts/*.qmd
    - qmd_scripts/validation/**/*.qmd
    - qmd_scripts/core_analysis/**/*.qmd
    - "!qmd_scripts/validation/bayesian_multi_epoch/**/*.qmd"
    - "!qmd_scripts/core_analysis/04_bayesian/**/*.qmd"
    - docs/*.qmd

bibliography: bibliography.bib
cite-method: biblatex
link-citations: true

website:
  title: "Inference on Birth-Death Processes for Texts"
  repo-url: https://github.com/jaycrick/inf-bp-texts
  repo-actions: [edit, issue]
  bread-crumbs: true
  page-navigation: true
  navbar:
    left:
      - text: "Data Exploration"
        menu:
          - text: "NTVMR Data Exploration"
            file: qmd_scripts/core_analysis/01_data_exploration/manuscript_data_exploration.qmd
          - text: "Kashouh Data Exploration"
            file: qmd_scripts/core_analysis/01_data_exploration/kashouh_data_exploration.qmd
      - text: "Single-Epoch Analysis"
        menu:
          - text: "NTVMR Single-Epoch"
            file: qmd_scripts/core_analysis/02_single_epoch/ntvmr_single_epoch_inference.qmd
          - text: "Kashouh Single-Epoch (FamilyK + FamilyJB)"
            file: qmd_scripts/core_analysis/02_single_epoch/kashouh_single_epoch_inference.qmd
      - text: "Multi-Epoch Analysis"
        menu:
          - text: "NTVMR Six-Epoch"
            file: qmd_scripts/core_analysis/03_multi_epoch/ntvmr_birth_death_inference.qmd
          - text: "NTVMR Initial Population"
            file: qmd_scripts/core_analysis/03_multi_epoch/ntvmr_initial_population_inference.qmd
          - text: "Kashouh Classification"
            file: qmd_scripts/core_analysis/03_multi_epoch/kashouh_multi_epoch_inference.qmd
          - text: "Likelihood Surface"
            file: qmd_scripts/core_analysis/03_multi_epoch/single_vs_multi_epoch_comparison.qmd
          - text: "Optimizer"
            file: qmd_scripts/core_analysis/03_multi_epoch/optimizer_comparison.qmd
      - text: "Bayesian Analysis"
        menu:
          - text: "Kashouh FamilyK Bayesian"
            file: qmd_scripts/core_analysis/04_bayesian/kashouh_family_k_bayesian_inference.qmd
          - text: "Kashouh Single-Epoch Bayesian"
            file: qmd_scripts/core_analysis/04_bayesian/kashouh_single_epoch_bayesian.qmd
          - text: "NTVMR Single-Epoch Bayesian"
            file: qmd_scripts/core_analysis/04_bayesian/ntvmr_single_epoch_bayesian.qmd
          - text: "NTVMR Six-Epoch Bayesian"
            file: qmd_scripts/core_analysis/04_bayesian/ntvmr_birth_death_bayesian.qmd
          - text: "NTVMR Initial-Population Bayesian"
            file: qmd_scripts/core_analysis/04_bayesian/ntvmr_initial_population_bayesian.qmd
      - text: "Validation: Single-Epoch"
        menu:
          - text: "Simulation checks"
            file: qmd_scripts/validation/single_epoch/01_simulation_checks.qmd
          - text: "Single-fit debug"
            file: qmd_scripts/validation/single_epoch/02_single_fit_debug.qmd
          - text: "Optimisation framework"
            file: qmd_scripts/validation/single_epoch/03_optimisation_framework.qmd
          - text: "Simulator comparison"
            file: qmd_scripts/validation/single_epoch/05_simulator_comparison.qmd
          - text: "Bulk inference"
            file: qmd_scripts/validation/single_epoch/06_bulk_inference.qmd
          - text: "Asymptotic consistency"
            file: qmd_scripts/validation/single_epoch/07_asymptotic_consistency.qmd
          - text: "Asymptotic consistency (LLM)"
            file: qmd_scripts/validation/single_epoch/08_asymptotic_consistency_llm.qmd
          - text: "Subcritical splitting"
            file: qmd_scripts/validation/single_epoch/09_subcritical_splitting.qmd
      - text: "Validation: Multi-Epoch"
        menu:
          - text: "Simulation checks"
            file: qmd_scripts/validation/multi_epoch/01_simulation_checks.qmd
          - text: "Single-fit debug"
            file: qmd_scripts/validation/multi_epoch/02_single_fit_debug.qmd
          - text: "Bulk inference"
            file: qmd_scripts/validation/multi_epoch/03_bulk_inference.qmd
          - text: "Bulk inference (single rate)"
            file: qmd_scripts/validation/multi_epoch/04_bulk_inference_single_rate.qmd
          - text: "Bulk inference (zero birth)"
            file: qmd_scripts/validation/multi_epoch/05_bulk_inference_zero_birth.qmd
          - text: "Sensitivity + benchmark"
            file: qmd_scripts/validation/multi_epoch/06_sensitivity_benchmark.qmd
      - text: "Validation: Bayesian Multi-Epoch"
        menu:
          - text: "Simulation checks"
            file: qmd_scripts/validation/bayesian_multi_epoch/01_simulation_checks.qmd
          - text: "Single-fit debug"
            file: qmd_scripts/validation/bayesian_multi_epoch/02_single_fit_debug.qmd
          - text: "Bulk inference"
            file: qmd_scripts/validation/bayesian_multi_epoch/03_bulk_inference.qmd
