repos:
  # Built-in hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude_types: [html]
      - id: end-of-file-fixer
        exclude_types: [html]
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        exclude_types: [html]
      - id: debug-statements

  # Ruff linting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.7
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
        args: [--diff]

  # isort import sorting
  - repo: https://github.com/pycqa/isort
    rev: 6.0.1
    hooks:
      - id: isort

  # MyPy type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.17.1
    hooks:
      - id: mypy
        args: [--strict]
        additional_dependencies:
          - pydantic
          - types-requests
          - joblib-stubs
          - pandas-stubs
          - scipy-stubs
          - plotly-stubs
          - lxml-stubs
          - types-torch
        files: ^src/

  # toml-sort
  - repo: https://github.com/pappasam/toml-sort
    rev: v0.24.3
    hooks:
      - id: toml-sort
        args: [--no-sort-tables, --sort-inline-arrays, --sort-inline-tables]
        files: '\.toml$'
