repos:
  # Built-in hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude_types: [html]
      - id: end-of-file-fixer
        exclude_types: [html]
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        exclude_types: [html]
      - id: debug-statements

  # Local hooks run through uv so ruff/basedpyright versions come from uv.lock
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        language: system
        entry: uv run ruff check --fix
        types: [python]
      - id: ruff-format
        name: ruff format
        language: system
        entry: uv run ruff format
        types: [python]
      - id: basedpyright
        name: basedpyright
        language: system
        entry: uv run basedpyright --project pyproject.toml src/
        pass_filenames: false
        files: ^(src/|pyproject\.toml$)

  # panache: Markdown/Quarto linting and formatting
  - repo: https://github.com/jolars/panache-pre-commit
    rev: v2.56.0
    hooks:
      - id: panache-lint
        args: [--fix]
      - id: panache-format
        args: [--check]
