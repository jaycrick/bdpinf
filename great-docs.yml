# Great Docs Configuration
# See https://posit-dev.github.io/great-docs/user-guide/configuration.html

# Module Name (optional)
# ----------------------
# Set this if your importable module name differs from the project name.
# Example: project 'py-yaml12' with module name 'yaml12'
# module: yaml12

# Docstring Parser
# ----------------
# The docstring format used in your package (numpy, google, or sphinx)
parser: numpy

# Dynamic Introspection
# ---------------------
# Use runtime introspection for more accurate documentation (default: true)
# Set to false if your package has cyclic alias issues (e.g., PyO3/Rust bindings)
dynamic: true

# API Discovery Settings
# ----------------------
# Exclude items from auto-documentation
# exclude:
#   - InternalClass
#   - helper_function

# `pypi: false` is documented but currently crashes the build with this
# project's config (UnboundLocalError in great_docs.core: a "Citing this
# package" margin link unconditionally reads a variable that's only assigned
# when pypi is not False). Left at its default (auto-detect + link) until
# fixed upstream. See docs/design/DOCS_TOOLING_EVALUATION.md.

# Logo & Favicon
# ---------------
# Point to a single logo file (replaces the text title in the navbar):
# logo: assets/logo.svg
#
# For light/dark variants:
# logo:
#   light: assets/logo-light.svg
#   dark: assets/logo-dark.svg
#
# To show the text title alongside the logo, add: show_title: true

# Funding / Copyright Holder
# --------------------------
# Credit the organization that funds or holds copyright for this package.
# Displays in sidebar and footer. Homepage and ROR provide links.
# funding:
#   name: "Posit Software, PBC"
#   roles:
#     - Copyright holder
#     - funder
#   homepage: https://posit.co
#   ror: https://ror.org/03wc8by49

# API Reference Structure
# -----------------------
# Customize the sections below to organize your API documentation.
# - Reorder items within a section to change their display order
# - Move items between sections or create new sections
# - Use 'members: false' to exclude methods from documentation
# - Add 'desc:' to sections for descriptions

reference:
  - title: Core model
    desc: >
      BirthDeathProcess — the central data structure passed between all
      modules. Holds creation times, epoch boundaries, per-epoch birth/death
      rates, and optional individual-level genealogy records.
    contents:
      - name: BirthDeathProcess

  - title: Mathematical functions
    desc: >
      Pure likelihood and probability functions. No class state; all inputs
      and outputs are float64 tensors.
    contents:
      - models.math_extinction
      - models.math_nested
      - models.math_age_densities
      - models.rate_functions
      - models.math_populations
      - models.genealogy

  - title: Input validation
    desc: >
      Normalisation and runtime validation for tensors, shapes, ranges, and
      epoch monotonicity.
    contents:
      - models.validation

  - title: Inference
    desc: Maximum likelihood estimation and covariance.
    contents:
      - inference.fitting.fit_birth_death_processes
      - name: inference.fitting.ParameterConstraints
      - inference.likelihood.log_likelihood
      - inference.likelihood.negative_log_likelihood
      - inference.uncertainty
      - inference.bayesian
      - inference.persistence

  - title: Simulation
    desc: Gillespie simulation and multilevel splitting for rare-event estimation.
    contents:
      - simulation.simulator.simulate_birth_death_process
      - simulation.simulator.simulate_birth_death_lifespans
      - simulation.conditioned.simulate_birth_death_process_from_contour_process
      - simulation.conditioned.simulate_subcritical_survival_splitting
      - name: simulation.conditioned.SplittingConfig
      - simulation.conditioned.select_level_times_for_band
      - simulation.survival_conditioning

  - title: Visualization
    desc: Altair rendering utilities for model results and diagnostics.
    contents:
      - visualization.altair_theme.save_chart
      - visualization.altair_theme.save_chart_html
      - visualization.altair_theme.display_svg
      - visualization.altair_theme.set_figure_dir
      - visualization.genealogy.plot_genealogy_tree
      - visualization.bayesian_plots
      - visualization.splitting_plots
      - visualization.plotting
      - visualization.age_fit_plot
      - visualization.age_density_plots
      - visualization.correlation_plots
      - visualization.date_distribution_plots

  - title: Analysis
    desc: >
      Higher-level helpers for fitting and summarising results across named
      data subsets, and for generating/persisting validation and recovery
      studies.
    contents:
      - analysis.single_epoch
      - analysis.subset_fitting
      - analysis.latex_tables
      - analysis.date_density
      - analysis.bootstrap_date_density
      - analysis.validation_helpers
      - analysis.spike_detection
      - analysis.asymptotic_consistency
      - analysis.single_epoch_recovery
      - analysis.multi_epoch_recovery

  - title: Utilities
    desc: Project-path resolution and shared types.
    contents:
      - find_project_root
      - types

# Site URL
# --------
# Canonical address of the deployed documentation site.
# Required for subdirectory deployments, skills page install commands,
# .well-known/ discovery, and sitemaps.
# site_url: "https://your-org.github.io/your-package/"

# Site Settings
# -------------
# site:
#   theme: flatly              # Quarto theme (default: flatly)
#   toc: true                  # Show table of contents (default: true)
#   toc-depth: 2               # TOC heading depth (default: 2)
#   toc-title: On this page    # TOC title (default: "On this page")

# Jupyter Kernel
# --------------
# Jupyter kernel to use for executing code cells in .qmd files.
# This is set at the project level so it applies to all pages, including
# auto-generated API reference pages. Can be overridden in individual .qmd
# file frontmatter if needed for special cases.
jupyter: python3
