[tool.poetry]
name = "inf-bp-texts"
version = "0.1.0"
description = "A Python platform for performing inference and analysis on various datasets downloaded from APIs"
authors = ["JC <jcacademicresearch@gmail.com>"]
readme = "README.rst"
packages = [{include = "inf_bp_texts", from = "src"}]

[tool.poetry.dependencies]
python = "^3.13"
requests = "^2.32.4"
pandas = "^2.3.1"
numpy = "^2.0.0"
scikit-learn = "^1.5.0"
jupyter = "^1.0.0"
plotly = "^6.2.0"
scipy = "^1.16.1"
lxml = "^6.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
mypy = "^1.17.1"
ruff = "^0.12.7"
isort = "^6.0.1"
pre-commit = "^4.2.0"
scipy-stubs = "^1.16.1.0"

[tool.black]
line-length = 88
target-version = ['py313']
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["inf_bp_texts"]

[tool.mypy]
strict = true
pretty = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
