[project]
name = "bdpinf"
version = "0.4.2"
description = "Inference, simulation, and visualisation for linear birth-death (branching) processes."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "altair>=6.0.0",
  "bdsurv>=0.5.0",
  "beartype>=0.19.0",
  "itables>=2.7.0",
  "jax>=0.4.38",
  "jaxtyping>=0.2.38",
  "joblib>=1.5.3",
  "numpy>=2.4.2",
  "numpyro>=0.16.0",
  "optax>=0.2.4",
  "optimistix>=0.0.9",
  "pandas>=3.0.0",
  "scipy>=1.17.0",
  "vl-convert-python>=1.9.0.post1"
]

# bdsurv is not published; pin to a git revision (bump `rev` to pick up bdsurv
# changes; its tags are for internal tracking only).  For local co-development,
# temporarily point this at `{ path = "../bdsurv", editable = true }`.
[tool.uv.sources]
bdsurv = { git = "ssh://git@github.com/jaycrick/bdsurv.git", rev = "b660a53" }

[dependency-groups]
gpu = [
  "jax[cuda12]>=0.4.38; sys_platform == 'linux'",
  "nvidia-cudnn-cu12<9.10; sys_platform == 'linux'"
]
dev = [
  "basedpyright>=1.22.0",
  "great-docs>=0.14.0",
  "isort>=8.0.0",
  "joblib-stubs>=1.5.3.1.20260117",
  "jupyter-cache>=1.0.1",
  "jupyter>=1.1.1",
  "lintquarto>=0.13.1",
  "panache-cli>=2.56.0",
  "pandas-stubs>=3.0.0.260204",
  "pre-commit>=4.5.1",
  "pytest-cov>=7.0.0",
  "pytest>=9.0.2",
  "quarto>=0.1.0",
  "ruff>=0.15.1",
  "scipy-stubs>=1.17.0.2",
  "typer>=0.24.1",
  "typing-extensions>=4.15.0"
]

[tool.isort]
known_first_party = ["bdpinf"]
line_length = 88
multi_line_output = 3
profile = "black"

[tool.basedpyright]
include = ["src"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
reportMissingTypeStubs = "warning"
# JAX/jaxtyping stubs have gaps — suppress unknown-type cascades until upstream improves
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"
reportUnknownParameterType = "none"
# The next four hide ~40 stub-quality errors (Altair chart unions, jax.core,
# optax, scan carries), not bugs; re-check after upstream stubs improve.
reportAttributeAccessIssue = "none"
reportIndexIssue = "none"
reportArgumentType = "none"
reportReturnType = "none"
# lintquarto concatenates all cells into one temp .py file; the timing-bracket pattern
# (import time in both the first and last cell) triggers this in every notebook.
# ruff F811 catches genuine duplicate imports in src/, so suppressing here is safe.
reportDuplicateImport = "none"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
  "B", "C4", "C90", "D", "E", "F", "I", "PIE", "PT", "RUF", "SIM", "UP", "W",
  "ARG", "BLE", "ERA", "N", "NPY", "PERF", "PLR", "PTH", "RET", "SLF"
]

ignore = [
  "C408", # dict(key=value) is a fine way to build kwargs
  "N803", # mathematical argument names (T, E, W) follow the paper
  "N806", # mathematical variable names (T, E, W) follow the paper
  "PLR2004", # numeric literals are normal in mathematical code and tests
  "PT018", # composite asserts are fine; splitting them hurts readability
  "RUF001", # math notation (λ, μ, ×, ·) is intentional in strings, docstrings, comments
  "RUF002",
  "RUF003"
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 10
max-positional-args = 5

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# jaxtyping dimension strings (e.g. Float[Array, " epochs"]) are not Python
# expressions, so ruff's forward-annotation checker (F722) fires on them.
"src/bdpinf/models/math_*.py" = ["F722"]
# __init__.py files call jax.config.update before package imports — this is
# intentional (float64 must be enabled before any jax array is created).
"src/**/__init__.py" = ["E402"]
"tests/*" = [
  "D101", # test classes are self-documenting via their names
  "D102", # test methods are self-documenting via their names
  "E501", # test strings and fixture data are allowed to be long
  "PLR0913", # test helpers and fixtures take many arguments
  "PLR0917",
  "SLF001" # tests exercise private helpers directly
]
# lintquarto extracts qmd cells to temporary .py files in the same directory.
# These rules are false positives or impractical to enforce in notebook code:
"qmd_scripts/**" = [
  "B018", # bare last-line expressions are intentional display outputs
  "B905", # zip() strict= is impractical to require in analysis notebooks
  "BLE001", # the compile-time-report cell tolerates an unreadable timing log
  "D100", # notebooks have no module-level docstring
  "D101", # notebook TypedDict/dataclasses don't need class docstrings
  "D103", # notebook helper functions don't need docstrings
  "E501", # analysis cells routinely have long lines
  "I001", # import ordering across cells is flexible by design
  "PLR0917", # notebook helper functions take plain positional arguments
  "PTH123" # a one-off debug notebook writes its profile report with open()
]
"docs/**" = [
  "B018",
  "B905",
  "D100",
  "D101",
  "D103",
  "E501",
  "I001"
]

[tool.pytest.ini_options]
addopts = "-m \"not slow\" --strict-markers"
markers = [
  "recovery: simulate-then-fit parameter recovery tests (implies slow)",
  "regression: golden-value tests guarding against numerical drift",
  "slow: long-running tests that are skipped in regular runs"
]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
precision = 2

[tool.setuptools.packages.find]
where = ["src"]
include = ["bdpinf*"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
