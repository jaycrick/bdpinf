[project]
name = "inf-bp-texts"
version = "0.1.0"
description = "Inference for birth-and-death processes in Python."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "griffe<2.0.0",
    "itables>=2.7.0",
    "joblib>=1.5.3",
    "jupyter>=1.1.1",
    "kaleido>=1.2.0",
    "lxml>=6.0.2",
    "numpy>=2.4.2",
    "pandas>=3.0.0",
    "plotly>=6.5.2",
    "pydantic>=2.12.5",
    "scipy>=1.17.0",
    "torch>=2.10.0",
    "torchvision>=0.25.0",
]

[dependency-groups]
dev = [
    "isort>=7.0.0",
    "joblib-stubs>=1.5.3.1.20260117",
    "jupyter-cache>=1.0.1",
    "lintquarto>=0.8.0",
    "lxml-stubs>=0.5.1",
    "mypy>=1.19.1",
    "pandas-stubs>=3.0.0.260204",
    "plotly-stubs>=0.1.2",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "quarto>=0.1.0",
    "quartodoc>=0.11.1",
    "ruff>=0.15.1",
    "scipy-stubs>=1.17.0.2",
    "toml-sort>=0.24.3",
    "types-torch>=0.1.1",
    "typing-extensions>=4.15.0",
]

[tool.black]
include = '\.pyi?$'
line-length = 88
target-version = ['py313']

[tool.isort]
known_first_party = ["inf_bp_texts"]
line_length = 88
multi_line_output = 3
profile = "black"

[tool.mypy]
pretty = true
show_error_codes = true
strict = true

[tool.toml-sort]
all = true
ignore_case = true
in_place = true
no_block_comments = true
no_comments = true
no_footer_comments = true
no_header_comments = true
no_inline_comments = true
no_sort_tables = true
sort_first = ["key1", "key2"]
sort_inline_arrays = true
sort_inline_tables = true
sort_table_keys = true

[tool.pytest.ini_options]
python_classes = ["Test*"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["inf_bp_texts*"]
