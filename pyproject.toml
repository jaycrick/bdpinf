[project]
name = "inf-bp-texts"
version = "0.1.0"
description = "A Python platform for New Testament manuscript data and running quality control, analysis, and birth-death process inference."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "griffe<2.0.0",
    "itables>=2.7.0",
    "joblib>=1.5.3",
    "jupyter>=1.1.1",
    "kaleido>=1.2.0",
    "lxml>=6.0.2",
    "numpy>=2.4.2",
    "pandas>=3.0.0",
    "plotly>=6.5.2",
    "pydantic>=2.12.5",
    "pyro-ppl>=1.9.1",
    "scipy>=1.17.0",
    "torch>=2.10.0",
    "torchvision>=0.25.0",
    "typer>=0.24.1",
]

[project.scripts]
inf-bp-texts = "inf_bp_texts.cli:main"

[dependency-groups]
dev = [
    "basedpyright>=1.22.0",
    "isort>=7.0.0",
    "joblib-stubs>=1.5.3.1.20260117",
    "jupyter-cache>=1.0.1",
    "lintquarto>=0.11.0",
    "lxml-stubs>=0.5.1",
    "mypy>=1.19.1",
    "pandas-stubs>=3.0.0.260204",
    "plotly-stubs>=0.1.2",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "quarto>=0.1.0",
    "quartodoc>=0.11.1",
    "ruff>=0.15.1",
    "scipy-stubs>=1.17.0.2",
    "toml-sort>=0.24.3",
    "types-torch>=0.1.1",
    "typing-extensions>=4.15.0",
]

[tool.isort]
known_first_party = ["inf_bp_texts"]
line_length = 88
multi_line_output = 3
profile = "black"

[tool.basedpyright]
include = ["src"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
reportMissingTypeStubs = "warning"
# types-torch community stubs are incomplete — suppress cascading failures until stubs improve
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"
reportUnknownParameterType = "none"
reportAttributeAccessIssue = "none"
# Cascade from unknown torch tensor types:
reportIndexIssue = "none"
reportOperatorIssue = "none"
reportAbstractUsage = "none"
reportArgumentType = "none"
reportOptionalOperand = "none"
reportReturnType = "none"
reportGeneralTypeIssues = "none"

[tool.mypy]
pretty = true
show_error_codes = true
strict = true

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W", "D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101", # asserts are the mechanism of the tests
    "D101", # test classes are self-documenting via their names
    "D102", # test methods are self-documenting via their names
    "E501", # test strings and fixture data are allowed to be long
]

[tool.toml-sort]
all = true
ignore_case = true
in_place = true
no_sort_tables = true
sort_first = ["key1", "key2"]
sort_inline_arrays = true
sort_inline_tables = true
sort_table_keys = true

[tool.pytest.ini_options]
addopts = "-m \"not slow\" --cov=src --cov-report=term-missing --cov-report=html --cov-report=xml --cov-fail-under=80"
markers = [
    "slow: long-running tests that are skipped in regular runs",
    "regression: golden-value tests guarding against numerical drift",
    "recovery: simulate-then-fit parameter recovery tests (implies slow)",
]
python_classes = ["Test*"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
precision = 2

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["inf_bp_texts*"]
